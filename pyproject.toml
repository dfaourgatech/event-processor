[project]
name = "event-processor"
version = "0.1.0"
description = "Reactive event processor: validation, triage, idempotent persistence"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "confluent-kafka>=2.3",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
